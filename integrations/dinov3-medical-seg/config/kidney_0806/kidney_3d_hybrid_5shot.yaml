# Exp A — 3D multi-scale hybrid (LEADING candidate).
# context3d_hybrid with 4-level PyTorch ViT-S (out_indices [2,5,8,11]).
# Directly addresses the report's 3D failure modes:
#   - detail branch (ScaleAware2D, 4-level reassembly H/2..H/16) -> 2D-quality
#     boundaries without raw pixel skips;
#   - volume branch (Context3DLite) -> cross-slice context;
#   - 4 ViT-S intermediate levels (newly unlocked vs the 1-level ONNX path).
# + casewise norm + fixed z_smooth for inter-slice consistency.
_base_: ["kidney_0806_base.yaml"]

model:
  out_indices: [2, 5, 8, 11]                # 4 levels -> stage3/6/9/12 (REQUIRED)

decoder:
  type: "context3d_hybrid"
