  z_smooth_sigma: 6.0                       # mm; converted to voxels, clamped [1,8]
  z_smooth_learnable: false                 # fixed low-pass prior; prevents oscillatory kernels

exp_name: "kidney_0806_3d_hybrid_s0657_s0661_s0668_s0693_s0749"
