# Quick validation config — MSD Heart (left atrium), 5-shot
_base_: ["train.yaml"]
model:
  model_path: "./models/dinov3-vitb16"
  num_classes: 2
  input_normalization: "imagenet"
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
finetune:
  method: "frozen"
decoder:
  type: "segformer3d"
data:
  name: "msd_heart"
  data_root: "./data/msd_heart"
  img_size: [224, 224]
  modality: "other"
  k_shot: 5
training:
  epochs: 30
  batch_size: 1
  grad_accumulation: 2
  mixed_precision: false
  sub_volume:
    enabled: false
  lr: 1.0e-3
  seed: 42
augmentation:
  enabled: false
