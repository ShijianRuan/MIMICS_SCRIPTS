# DINOv3 Medical Segmentation — configs

# Default training config (used as base for model-specific configs)
training:
  device: "auto"
  optimizer: "adamw"
  lr: 1.0e-3
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 5
  epochs: 200
  batch_size: 1
  grad_accumulation: 4
  mixed_precision: true

  sub_volume:
    enabled: true
    size: [32, 256, 256]

loss:
  type: "dice_ce"
  dice_weight: 0.5
  ce_weight: 0.5

# Model config — inherited by everything else
model:
  model_path: "./models/dinov3-vitb16"
  out_indices: [2, 5, 8, 11]
  num_classes: 2
  slice_axis: 2

finetune:
  method: "lora"      # frozen | lora | full
  lora_rank: 8
  lora_alpha: 16

decoder:
  type: "segformer3d"  # linear3d | mlp_probe | segformer3d | dpt3d

data:
  name: "default"
  data_root: "./data"
  img_size: [512, 512]
  in_channels: 1
  k_shot: -1           # -1 = all data
  fold: 0
