# Phase 1 Baseline: Frozen + SegFormer3D, vary k-shot and img_size
# This serves as the _base_ for all Phase 1 experiments
_base_: ["train.yaml"]
model:
  model_path: "./models/dinov3-vitb16"
  num_classes: 2
  input_normalization: "imagenet"
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  out_indices: [2, 5, 8, 11]
  slice_axis: 2
finetune:
  method: "frozen"
decoder:
  type: "segformer3d"
data:
  name: "totalseg"
  img_size: [224, 224]
  modality: "ct"
  k_shot: 5
  fold: 0
training:
  epochs: 50
  batch_size: 1
  grad_accumulation: 2
  mixed_precision: false
  sub_volume:
    enabled: false
  lr: 1.0e-3
  seed: 42
  keep_last_checkpoints: 2
loss:
  type: "dice_ce"
augmentation:
  enabled: false
