# Ablation A0: ViT-B frozen + feature_unet2d (single final layer + raw skip) + dice_ce
# Baseline. Isolates ViT-B frozen single-layer with nnU-Net-aligned loss (dice_ce).
_base_: ["../train.yaml"]

model:
  model_path: "./models/dinov3-vitb16"
  encoder_backend: "pytorch"
  num_classes: 2
  out_indices: [11]                     # feature_unet2d only uses final feature
  slice_axis: axial
  slice_batch_size: 4
  channel_policy: repeat
  input_normalization: "imagenet"
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

finetune:
  method: "frozen"

decoder:
  type: "feature_unet2d"

data:
  name: "kidney_left"
  data_root: "./data/totalseg/kidney_left"
  img_size: [512, 512]
  modality: "ct"
  target_spacing: null
  k_shot: -1
  support_case_ids: ["s0657", "s0661", "s0668", "s0693", "s0749"]
  validation_case_ids: ["s1031", "s1120", "s1130"]
  slice_normalization: "timeslice_casewise"

loss:
  type: "dice_ce"                       # unified to dice_ce (nnU-Net-aligned)
  dice_weight: 0.5
  ce_weight: 0.5

training:
  device: "auto"
  pipeline: "cached_slices"
  optimizer: "adam"
  lr: 0.0005
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 1
  epochs: 150
  batch_size: 4
  grad_accumulation: 1
  mixed_precision: true
  num_workers: 0
  seed: 0
  validation_enabled: true
  validation_interval: 5

experiment:
  name: "ablation_A0_feat_b_frozen_single"
  output_dir: "./experiments/ablation"
