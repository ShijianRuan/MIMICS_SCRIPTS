# ==============================================================================
# ModelMap.toml
# ==============================================================================
# 每个模型的分割类别及其对应的mask值，每个模型独立从1开始编号，0为背景（nnUnet要求必须如此）
# ！！！注意：[CT_Combine]和[MR_Combine]列表是为了拼成一张整体Mask时统一且不重复而设立的，不能用于训练



#=========================================================
# 模型索引
#=========================================================
# MI器官分割的模型
# CT：[CT1_Head],[CT2_Chest],[CT3_Lung],[CT4_Abdomen],[CT5_Liver],[CT6_KidneySpleen],
#     [CT7_Vessel],[CT8_Vertebrae]，[CT9_Chestbone]，[CT10_Abdomenbone]，[CT11_Abdomenmuscle]，
#     [CT12_Rib]，[CT13_Sternum]，[CT14_Breast]，[CT15_Headglands]，[CT16_uterus]
# 注：CT12-CT16暂未重新训练，12调用bingbing的更好的肋骨分割模型，13-15调用subtask模型，16暂无标注）
#
# MR: [MR1_Head],[MR2_Chest],[MR3_Abdomen],[MR4_Vessel]，[MR5_Vertebrae],
#     [MR6_Chestbone]， [MR7_AbdomenBone], [MR8_muscle]
# 注：MR5仅包含椎间盘和脊髓，椎骨等使用subtask模型（因训练数据标注中椎骨都是一个label）
#
# 粗分割定位模型
#     [CT_All_Coarse],[MR_All_Coarse]，[MR_Old_Coarse]
#
# 探针去骨预处理所需骨分割
#     [CT_BoneProbe],[CT_BoneProbe_Simple]
#
# 总的组织列表（非模型）
#     [CT_Combine],[MR_Combine]




