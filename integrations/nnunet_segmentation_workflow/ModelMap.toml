# ==============================================================================
# MR MIv500 系列模型的粗分割定位模型
# ==============================================================================
[MR_All_Coarse.MR1_Head]
label = 1
organs = ["brain"]

[MR_All_Coarse.MR2_Chest]
label = 2
organs = ["heart", "aorta", "lung_left", "lung_right", "esophagus"]

[MR_All_Coarse.MR3_Abdomen]
label = 3
organs = [
    "spleen", "kidney_right", "kidney_left", "gallbladder", "liver",
    "stomach", "pancreas", "adrenal_gland_right", "adrenal_gland_left",
    "small_bowel", "duodenum", "colon", "urinary_bladder", "prostate",
    ]

[MR_All_Coarse.MR4_Vessel]
label = 4
organs = [
    "inferior_vena_cava", "portal_vein_and_splenic_vein", "iliac_artery_left",
    "iliac_artery_right", "iliac_vena_left", "iliac_vena_right",
]

[MR_All_Coarse.MR5_Vertebrae]
label = 5
organs = [
    "intervertebral_discs", "spinal_cord", "sacrum",
    "vertebrae",           #精分割没有椎骨和sacrum，用的老模型，但粗分割定位需要
]

[MR_All_Coarse.MR6_Chestbone]
label = 6
organs = [
    "humerus_left", "humerus_right", "scapula_left", "scapula_right",
    "clavicula_left", "clavicula_right",
]

[MR_All_Coarse.MR7_AbdomenBone]
label = 7
organs = ["femur_left", "femur_right", "hip_left", "hip_right",]

[MR_All_Coarse.MR8_muscle]
label = 8
organs = [
    "gluteus_maximus_left", "gluteus_maximus_right",
    "gluteus_medius_left", "gluteus_medius_right",
    "gluteus_minimus_left", "gluteus_minimus_right",
    "autochthon_left", "autochthon_right",
    "iliopsoas_left", "iliopsoas_right",
]


