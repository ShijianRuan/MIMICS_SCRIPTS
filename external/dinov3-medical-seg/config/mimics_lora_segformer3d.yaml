# Mimics — base few-shot fine-tuning config (LoRA + SegFormer3D)
#
# This is the default template for DINOv3 training inside Mimics-Script.
# The pipeline overrides data_root, epochs, lr, img_size, etc. with
# values chosen by the user in the external GUI.  The template provides
# the model architecture, optimizer, and loss strategy only.

_base_: ["train.yaml"]

model:
  model_path: "./models/dinov3-vitb16"
  num_classes: 2

finetune:
  method: "lora"
  lora_rank: 8
  lora_alpha: 16

decoder:
  type: "segformer3d"

data:
  name: "mimics"
  data_root: "./data/mimics"
  img_size: [224, 224]

training:
  epochs: 10
  batch_size: 1
  grad_accumulation: 1
  mixed_precision: false
  sub_volume:
    enabled: false
