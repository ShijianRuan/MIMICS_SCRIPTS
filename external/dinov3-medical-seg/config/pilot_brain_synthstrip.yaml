_base_: ["train.yaml"]
model:
  model_path: "./models/dinov3-vitb16"
  num_classes: 2
  input_normalization: "imagenet"
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
finetune:
  method: "frozen"
decoder:
  type: "segformer3d"
data:
  name: "synthstrip_brain"
  data_root: "./data/synthstrip"
  img_size: [224, 224]
  modality: "other"
  k_shot: 5
training:
  epochs: 50
  batch_size: 1
  grad_accumulation: 2
  mixed_precision: false
  sub_volume: {enabled: false}
  seed: 42
augmentation:
  enabled: false
