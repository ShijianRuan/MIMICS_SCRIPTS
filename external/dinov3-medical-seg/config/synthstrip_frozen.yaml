_base_: ["train.yaml"]

model:
  model_path: "./models/dinov3-vitb16"
  num_classes: 2       # binary: brain vs background

finetune:
  method: "frozen"     # start with simplest

decoder:
  type: "linear3d"     # start with simplest decoder

data:
  name: "synthstrip"
  data_root: "./data/synthstrip"
  img_size: [64, 64]
  k_shot: 5

training:
  epochs: 20
  batch_size: 1
  grad_accumulation: 1
  sub_volume:
    enabled: false     # volumes are only 22 slices deep
