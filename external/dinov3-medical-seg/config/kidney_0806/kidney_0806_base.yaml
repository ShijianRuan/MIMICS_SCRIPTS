# Shared base for the 0806 kidney_left few-shot ablation suite.
#
# All runs use the SAME fixed data split, the SAME frozen PyTorch ViT-S/16
# encoder (the ONNX path is broken: onnxruntime DLL load fails and the on-disk
# ONNX file no longer matches the report's SHA), and the SAME dice_focal loss.
# Each experiment overrides only `model.out_indices`, `decoder.type`, and the
# channel policy / z_smooth to isolate a single architecture variable.
#
# Validation cases s1031/s1120/s1130 live in imagesTr alongside the 5 support
# cases, so `validation_case_ids` holds them out explicitly (see
# MedicalVolumeDataset). Support cases are selected by `support_case_ids`
# (CaseIdSubset). No leakage.
#
# Soft targets from the 0805 report (different ONNX encoder, so not directly
# comparable): 2D feature_unet2d = 0.7606, 3D segformer3d = 0.5877 mean Dice.

_base_: ["../train.yaml"]

model:
  model_path: "./models/dinov3-vits16"      # PyTorch safetensors (ONNX is broken)
  encoder_backend: "pytorch"                # FORCE pytorch; avoid model.onnx auto-select
  num_classes: 2
  slice_axis: axial
  slice_batch_size: 8
  channel_policy: repeat                    # Exp D overrides to 2_5d
  input_normalization: "imagenet"           # DINOv3 processor mean/std
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

finetune:
  method: "frozen"                          # frozen DINO; train decoder only

data:
  name: "kidney_left"
  data_root: "./data/totalseg/kidney_left"
  img_size: [512, 512]                      # match report's 512x512; divisible by 16
  modality: "ct"
  target_spacing: [1.5, 1.5, 1.5]           # native spacing (cases are 1.5mm iso); needed for z_smooth_sigma mm->voxel
  k_shot: -1                                # use explicit support_case_ids instead
  support_case_ids: ["s0657", "s0661", "s0668", "s0693", "s0749"]
  validation_case_ids: ["s1031", "s1120", "s1130"]
  normalization_scope: "case_casewise"      # casewise clip+z-score (parity with 2D path)
  intensity:
    casewise_percentiles: [0.5, 99.5]

loss:
  type: "dice_focal"                        # REQUIRED: kidney ~2% fg cold-start
  dice_weight: 0.5
  focal_weight: 0.5
  focal_alpha: 0.5
  focal_gamma: 2.0
  class_weights: [1.0, 20.0]                # foreground 20x: fixed split is 0.1-0.7% fg, focal alpha alone fails cold-start
  z_consistency_weight: 0.05                # target-guided inter-slice gradient loss

training:
  device: "auto"
  optimizer: "adamw"
  lr: 0.0005
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 3
  epochs: 30
  batch_size: 1
  grad_accumulation: 1
  mixed_precision: true
  num_workers: 0
  seed: 0
  validation_enabled: true
  validation_interval: 3
  sub_volume:
    enabled: true
    size: [32, 512, 512]                    # depth32 matches report's best 3D run
    depth_halo: 12                           # >= sigma4 Gaussian radius; loss uses core only
    per_chunk_backward: true                 # backward each depth chunk to bound VRAM (12GB)

evaluation:
  surface_tolerance_mm: 2.0
