# Screening changes one named factor from each task's frozen 256px baseline.
# Confirmation sees only the winner selected on fold_00 and never reuses it for
# the reported folds.  Seeds model/data-loader stochasticity, not case splits.
study:
  # v4 is the FORMAL run after the review-driven hardening (fail-closed gates,
  # complete-matrix selector, async fan-out, provenance/hashes). The v3 brain
  # Tier-0 cells are a PILOT only and must not be mixed into v4 statistics.
  # Reuse the validated v3 benchmark folds via the Modal --benchmark-subdir arg
  # (benchmark is unchanged); results land under a fresh v4 subdir.
  id: totalseg_multi_organ_v4
  base_config: config/research/ct_fewshot_base.yaml
  benchmark_root: data/research/totalseg_multi_organ_v3
  results_root: research_results/totalseg_multi_organ_v4
  screening_fold: 0
  confirmation_folds: [1, 2, 3]
  shot_counts: [1, 3, 5]
  screening_training_seeds: [20260711]
  confirmation_training_seeds: [20260711, 20260729, 20260747]
  inference_seed: 20260711
  screen_epochs: 25
  confirmation_epochs: 80
  screen_early_stopping: {min_epochs: 8, patience: 8, min_delta: 0.001}
  confirmation_early_stopping: {min_epochs: 20, patience: 15, min_delta: 0.001}
  # 2 mm is a transparent surface-Dice tolerance for this CT research set;
  # it is not a clinical acceptance threshold.
  surface_tolerance_mm: 2.0

# Tier-0 regime pre-screen: for each task choose a sampling x loss regime BEFORE
# the factor screen, because whole-body CT starves the slice-wise model of
# foreground (see docs). Cells: full_dice_ce (collapse control), full_dice_focal,
# patch_dice_ce, patch_dice_focal. Patch geometry comes from the train-only
# fingerprint (src/research/regime.py). Runtime authority is regime.py; this
# block only registers the axis and the degenerate guardrail threshold.
regimes:
  cell_ids: [full_dice_ce, full_dice_focal, patch_dice_ce, patch_dice_focal]
  screening_fold_only: true
  degenerate_dice_threshold: 0.05


candidates:
  # Brain: large compact target. Each row differs from brain_base only by the
  # named factor, so a screening difference is interpretable.
  - id: brain_base_frozen_segformer_256
    task: brain
    is_reference: true
    changed_factor: frozen_segformer_baseline
    overrides: {}
  - id: brain_resolution_320
    task: brain
    changed_factor: input_resolution
    overrides:
      data: {img_size: [320, 320]}
      model: {slice_batch_size: 1}
  - id: brain_linear_readout
    task: brain
    changed_factor: decoder_linear_vs_segformer
    overrides: {decoder: {type: linear3d}}
  - id: brain_token_pyramid
    task: brain
    changed_factor: decoder_token_pyramid
    overrides: {decoder: {type: token_pyramid3d}}
  - id: brain_lora_r4
    task: brain
    changed_factor: finetune_lora_r4
    overrides: {finetune: {method: lora, lora_rank: 4, lora_alpha: 8}}
  - id: brain_adapter32
    task: brain
    changed_factor: finetune_adapter32
    overrides: {finetune: {method: adapter, adapter_bottleneck: 32, adapter_position: after_attn}}
  - id: brain_feature_haar
    task: brain
    changed_factor: feature_haar_augmentation
    overrides:
      feature_augmentation: {enabled: true, type: haar_detail_attenuation, probability: 0.5, maximum_attenuation: 0.35}

  # Liver: input protocol is tested before adaptation.  ct_windows is a single
  # channel-construction factor (three fixed windows), not a decoder change.
  - id: liver_base_frozen_segformer_256
    task: liver
    is_reference: true
    changed_factor: frozen_single_soft_tissue_baseline
    overrides: {data: {intensity: {window: [-150.0, 250.0]}}}
  - id: liver_ct_windows
    task: liver
    changed_factor: ct_three_window_input
    overrides:
      data: {intensity: {windows: [[-150.0, 250.0], [0.0, 700.0], [150.0, 1500.0]]}}
      model: {channel_policy: ct_windows}
  - id: liver_imagenet_norm_off
    task: liver
    changed_factor: imagenet_normalization_off
    overrides:
      data: {intensity: {window: [-150.0, 250.0]}}
      model: {input_normalization: none}
  - id: liver_resolution_320
    task: liver
    changed_factor: input_resolution
    overrides:
      data: {img_size: [320, 320], intensity: {window: [-150.0, 250.0]}}
      model: {slice_batch_size: 1}
  - id: liver_lora_r4
    task: liver
    changed_factor: finetune_lora_r4
    overrides:
      data: {intensity: {window: [-150.0, 250.0]}}
      finetune: {method: lora, lora_rank: 4, lora_alpha: 8}

  # Aorta: continuity and boundary quality are independently tested.  HD95,
  # surface Dice and lesion-F1 are co-primary diagnostics for this task.
  - id: aorta_base_frozen_segformer_256
    task: aorta
    is_reference: true
    changed_factor: frozen_single_slice_baseline
    overrides: {data: {intensity: {window: [0.0, 700.0]}}}
  - id: aorta_2p5d_mm3
    task: aorta
    changed_factor: millimetre_2p5d_context
    overrides:
      data: {intensity: {window: [0.0, 700.0]}}
      model: {channel_policy: 2_5d, neighbor_distance_mm: 3.0}
  - id: aorta_token_pyramid
    task: aorta
    changed_factor: decoder_token_pyramid
    overrides:
      data: {intensity: {window: [0.0, 700.0]}}
      decoder: {type: token_pyramid3d}
  - id: aorta_dice_boundary
    task: aorta
    changed_factor: boundary_loss
    overrides:
      data: {intensity: {window: [0.0, 700.0]}}
      loss: {type: dice_boundary, dice_weight: 0.5, ce_weight: 0.5, boundary_weight: 0.2}
  - id: aorta_fingerprint_spacing
    task: aorta
    changed_factor: train_fingerprint_spacing_policy
    data_policy: fingerprint_spacing
    overrides: {data: {intensity: {window: [0.0, 700.0]}}}

  # Right adrenal: small-target controls.  Patch and cascade remain separate;
  # patch never grants a label-derived inference crop.
  - id: adrenal_base_frozen_segformer_256
    task: adrenal_gland_right
    is_reference: true
    changed_factor: frozen_full_fov_baseline
    overrides: {data: {intensity: {window: [-100.0, 300.0]}}}
  - id: adrenal_resolution_320
    task: adrenal_gland_right
    changed_factor: input_resolution
    overrides:
      data: {img_size: [320, 320], intensity: {window: [-100.0, 300.0]}}
      model: {slice_batch_size: 1}
  - id: adrenal_dice_focal
    task: adrenal_gland_right
    changed_factor: foreground_focal_loss
    overrides:
      data: {intensity: {window: [-100.0, 300.0]}}
      loss: {type: dice_focal, dice_weight: 0.7, focal_weight: 0.3, focal_alpha: 0.75, focal_gamma: 2.0}
  - id: adrenal_fingerprint_patch
    task: adrenal_gland_right
    changed_factor: train_fingerprint_patch_policy
    data_policy: fingerprint_patch
    overrides:
      data: {intensity: {window: [-100.0, 300.0]}}
      loss: {type: dice_focal, dice_weight: 0.7, focal_weight: 0.3, focal_alpha: 0.75, focal_gamma: 2.0}
  - id: adrenal_lora_r4
    task: adrenal_gland_right
    changed_factor: finetune_lora_r4
    overrides:
      data: {intensity: {window: [-100.0, 300.0]}}
      finetune: {method: lora, lora_rank: 4, lora_alpha: 8}

  # Thin bone: bone window, resolution, readout and PEFT are distinct factors.
  - id: scapula_base_frozen_segformer_256
    task: scapula_left
    is_reference: true
    changed_factor: frozen_broad_window_baseline
    overrides: {data: {intensity: {window: [-1024.0, 1024.0]}}}
  - id: scapula_bone_window
    task: scapula_left
    changed_factor: bone_window
    overrides: {data: {intensity: {window: [150.0, 1500.0]}}}
  - id: scapula_resolution_320
    task: scapula_left
    changed_factor: input_resolution
    overrides:
      data: {img_size: [320, 320], intensity: {window: [-1024.0, 1024.0]}}
      model: {slice_batch_size: 1}
  - id: scapula_token_pyramid
    task: scapula_left
    changed_factor: decoder_token_pyramid
    overrides:
      data: {intensity: {window: [-1024.0, 1024.0]}}
      decoder: {type: token_pyramid3d}
  - id: scapula_lora_r4
    task: scapula_left
    changed_factor: finetune_lora_r4
    overrides:
      data: {intensity: {window: [-1024.0, 1024.0]}}
      finetune: {method: lora, lora_rank: 4, lora_alpha: 8}
